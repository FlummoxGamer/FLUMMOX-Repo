name: Build & Publish

on:
  push:
    branches: [ main, master, dev ]
    paths-ignore:
      - '**.md'

  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          path: src

      - name: Determine output branch
        id: out
        run: |
          if [ "${{ github.ref_name }}" = "dev" ]; then
            echo "branch=builds-dev" >> $GITHUB_OUTPUT
          else
            echo "branch=builds" >> $GITHUB_OUTPUT
          fi

      - name: Read version from gradle.properties
        id: ver
        working-directory: src
        run: |
          V=$(grep -E '^bingecloud_version=' gradle.properties | cut -d= -f2 | tr -d ' ')
          if [ -z "$V" ]; then
            echo "bingecloud_version missing from gradle.properties"
            exit 1
          fi
          echo "version=$V" >> $GITHUB_OUTPUT
          echo "Building version $V"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.out.outputs.branch }}
          path: builds

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
          cache-disabled: true

      - name: Clean old .cs3
        run: rm -f builds/*.cs3

      - name: Verify secret is visible
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TVDB_API_KEY: ${{ secrets.TVDB_API_KEY }}
        run: |
          if [ -z "$TMDB_API_KEY" ]; then
            echo "SECRET IS EMPTY OR MISSING — fix repo secret"
            exit 1
          fi
          echo "SECRET OK — length ${#TMDB_API_KEY}"

      - name: Build plugins
        working-directory: src
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: gradle make --no-daemon --no-configuration-cache --no-build-cache

      - name: Generate plugins.json
        working-directory: src
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          NEW_VERSION: ${{ steps.ver.outputs.version }}
        run: gradle makePluginsJson --no-daemon --no-configuration-cache --no-build-cache

      - name: Copy artifacts to builds
        run: |
          find src -name "*.cs3" -exec cp {} builds/ \;
          find src -name "*.json" -path "*/build/*" -exec cp {} builds/ \;

      - name: Copy plugins.json (fallback path)
        run: |
          if [ ! -f builds/plugins.json ]; then
            find src -name "plugins.json" -exec cp {} builds/ \;
          fi

      - name: Patch plugins.json URL and bump version
        env:
          NEW_VERSION: ${{ steps.ver.outputs.version }}
          OUTPUT_BRANCH: ${{ steps.out.outputs.branch }}
        run: python3 src/scripts/patch_plugins.py

      - name: Push to builds branch
        working-directory: builds
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Build $(date +%s)" || echo "no changes"
          git push origin HEAD:${{ steps.out.outputs.branch }} --force
